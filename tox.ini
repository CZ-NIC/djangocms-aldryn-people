[tox]
envlist =
    clear-coverage
    flake8
    isort
    py{38,39,310}-cms31
    py{39}-cms{41}
    py{310,311}-cms{41,50}
    py{312}-cms{50,51}
    compute-coverage

skip_missing_interpreters = True

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = aldryn_people.tests.settings
whitelist_externals =
    gulp
    sh
    sleep
parallel_show_output = True
; commands =
;     {envpython} --version
;     - coverage erase
;     coverage run test_settings.py
;     - coverage report
deps =
    -r{toxinidir}/test_requirements.txt
    cms31: django-cms==3.11.*
    cms41: django-cms==4.1.*
    cms42: django-cms==4.1.*
    cms50: django-cms==5.0.*
    cms51: django-cms==5.1.*
commands =
    {envpython} --version
    coverage run --parallel-mode --source=aldryn_people --branch -m django test

[testenv:clear-coverage]
depends =
extras =
commands =
    coverage erase

[testenv:compute-coverage]
depends =
    py{38,39,310}-cms31
    py{39}-cms{41}
    py{310,311}-cms{41,50}
    py{312}-cms{50,51}
extras =
parallel_show_output = True
commands =
    coverage combine
    coverage report --show-missing --include=*/tests/* --fail-under=100
    coverage report --show-missing --include=aldryn_people/* --omit=*/tests/*
    coverage html

[testenv:flake8]
deps = flake8
commands = flake8

[testenv:isort]
deps = isort
commands = isort --check-only --diff aldryn_people
skip_install = true

[flake8]
exclude = aldryn_people/migrations/*,docs/conf.py,build/*
max-line-length = 120
